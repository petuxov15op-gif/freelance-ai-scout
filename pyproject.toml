[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freelance-ai-scout"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.20,<4",
  "aiohttp>=3.9,<4",
  "telethon>=1.40,<2",
  "SQLAlchemy>=2.0.40,<3",
  "alembic>=1.15,<2",
  "APScheduler>=3.11,<4",
  "httpx[socks]>=0.28,<1",
  "Pillow>=11,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
include = ["scout*"]

[tool.setuptools.package-data]
scout = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
