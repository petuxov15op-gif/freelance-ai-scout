services:
  scout:
    build:
      context: .
      args:
        SCOUT_SOURCE_REVISION: ${SCOUT_SOURCE_REVISION:-unknown}
    env_file: .env
    environment:
      SESSION_PATH: /app/data/telegram_user
    volumes:
      - scout_data:/app/data
    restart: unless-stopped
    init: true

volumes:
  scout_data:
